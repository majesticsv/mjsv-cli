name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatação
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # O teste de contrato usa o inventário de rotas vendorizado em
      # crates/mjsv-core/tests/api-routes.txt — ele NÃO vai à rede de propósito, para o CI não
      # depender de a produção estar de pé. Atualize com ./scripts/refresh-routes.sh.
      - name: Testes
        run: cargo test --all-features
